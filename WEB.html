<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Green Habit Ecosystem - Kanpur</title>
  <meta name="description"
    content="Join the Green Habit Ecosystem in Kanpur. Track green habits, join events, report waste, and help build a sustainable future.">
  <meta name="keywords"
    content="Green Habit, Kanpur, Sustainability, Eco-friendly, Carbon Footprint, Waste Management, NGO, CSR">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="preload" as="style"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">

  </noscript>
  <script src="https://cdn.tailwindcss.com" defer></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      background: linear-gradient(to bottom right, #D1FAE5, #e6fef2);
      --color-green-light: #6bf76b;
      --color-scrollbar-track: #f0f0f0;
      --shadow-card: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.07);
      --shadow-card-hover: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
      --color-primary-gov: #1d4ed8;
      --color-secondary-gov: #047857;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: #D1FAE5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      position: relative;
    }

    #three-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      opacity: 0.15;
      pointer-events: none;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      background: radial-gradient(circle at top, rgba(240, 255, 240, 0.98), rgba(255, 255, 255, 1));
      min-height: 100vh;
    }

    .btn-transition {
      transition: all 0.2s ease-in-out;
    }

    .btn-transition:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .focus-ring:focus-visible,
    .focus-ring:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.5);
    }

    .card-shadow {
      box-shadow: var(--shadow-card);
      transition: all 0.3s ease-out;
      border-radius: 0.5rem;
    }

    .card-shadow:hover {
      box-shadow: var(--shadow-card-hover);
      transform: translateY(-2px);
    }


    .directive-mandate {
      font-size: 1.25rem;
      line-height: 1.6;
      color: #1f2937;
      font-style: italic;
      padding: 1rem;
      margin-bottom: 1rem;
      border-left: 5px solid #60a5fa;
      background-color: #eff6ff;
    }

    @keyframes pulse-subtle {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.95;
        transform: scale(1.005);
      }
    }

    .animate-pulse-subtle {
      animation: pulse-subtle 4s ease-in-out infinite;
    }

    @keyframes skeleton-pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.6;
      }
    }

    .skeleton-pulse {
      animation: skeleton-pulse 1.5s ease-in-out infinite;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 8px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
      background-color: var(--color-green-light);
      border-radius: 4px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
      background-color: var(--color-scrollbar-track);
    }

    .modal-enter {
      animation: fadeIn 0.3s ease-out, slideDown 0.3s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes slideDown {
      from {
        transform: translateY(-20px);
      }

      to {
        transform: translateY(0);
      }
    }

    .card-shadow {
      box-shadow: var(--shadow-card);
      transition: all 0.3s ease-out;
    }

    .card-shadow:hover {
      box-shadow: var(--shadow-card-hover);
      transform: translateY(-2px);
    }

    .tab-button {
      padding: 0.5rem 1rem;
      font-weight: 600;
      border-radius: 0.5rem;
      transition: all 0.2s;
      border: 2px solid transparent;
    }

    .tab-button.active {
      background-color: white;
      color: #16a34a;
      border-color: #16a34a;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
    }

    .tab-button:not(.active) {
      background-color: #f3f4f6;
      color: #4b5563;
    }

    .tab-button:not(.active):hover {
      background-color: #e5e7eb;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.3s ease-out;
    }

    .nav-tab span,
    .mobile-nav-item span {
      pointer-events: none;
    }

    .btn-transition {
      transition: all 0.2s ease-in-out;
      transform-origin: center;
    }

    .btn-transition:hover {
      transform: scale(1.03);
    }

    .btn-transition:active {
      transform: scale(0.98);
    }

    .focus-ring {
      transition: box-shadow 0.2s ease-in-out;
    }

    .focus-ring:focus-visible,
    .focus-ring:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.5);
    }

    /* --- Styles for Slider and Homepage features from homepage.html --- */

    .slider-container {
      position: relative;
      overflow: hidden;
      border-radius: 0.5rem;
      perspective: 1000px;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .slider-wrapper {
      position: relative;
      width: 100%;
      height: 256px;
    }

    @media (min-width: 640px) {
      .slider-wrapper {
        height: 320px;
      }
    }

    @media (min-width: 768px) {
      .slider-wrapper {
        height: 384px;
      }
    }

    @media (min-width: 1024px) {
      .slider-wrapper {
        height: 400px;
      }
    }

    .slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
      opacity: 0;
      pointer-events: none;
      transform: rotateY(0deg);
    }

    .slide.active-slide {
      position: relative;
      opacity: 1;
      pointer-events: auto;
      z-index: 1;
      transform: rotateY(0deg);
      transition: transform 0.8s ease-in-out, opacity 0.01s 0.3s;
    }

    .slide.transitioning-out {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      z-index: 2;
      transition: transform 0.8s ease-in-out, opacity 0.8s ease-in-out;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: brightness(0.5);
    }

    .slide-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      text-align: center;
      width: 90%;
    }

    .slider-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(0, 0, 0, 0.3);
      border: none;
      color: white;
      padding: 0.75rem;
      border-radius: 9999px;
      cursor: pointer;
      transition: background-color 0.2s;
      z-index: 10;
    }

    .slider-arrow:hover {
      background-color: rgba(0, 0, 0, 0.6);
    }

    .slider-arrow-left {
      left: 1rem;
    }

    .slider-arrow-right {
      right: 1rem;
    }

    .slider-dots {
      position: absolute;
      bottom: 1rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5rem;
      z-index: 10;
    }

    .slider-dot {
      width: 10px;
      height: 10px;
      border-radius: 9999px;
      background-color: rgba(255, 255, 255, 0.5);
      border: 2px solid transparent;
      cursor: pointer;
      transition: background-color 0.3s, border-color 0.3s;
    }

    .slider-dot.active {
      background-color: white;
      border-color: var(--color-primary-gov);
    }

    /* Stat Card Animations */

    .stat-card {
      perspective: 1000px;
      overflow: hidden;
    }

    .stat-icon-container {
      transition: transform 0.5s ease-out;
      display: inline-block;
      position: relative;
      width: 60px;
      height: 60px;
      font-size: 40px;
      margin-bottom: 0.5rem;
    }

    .stat-card:hover .stat-icon-container {
      transform: scale(1.2);
    }

    .icon-users-inner {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
    }

    .icon-user-left,
    .icon-user-right {
      display: inline-block;
      transition: transform 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    }

    .stat-card:hover .icon-user-left {
      transform: translateX(-15px);
    }

    .stat-card:hover .icon-user-right {
      transform: translateX(15px);
    }

    @keyframes drag-message {

      0%,
      100% {
        transform: translateX(-50%) translateY(-15px) rotate(0deg) scale(1);
      }

      50% {
        transform: translateX(-50%) translateY(-25px) rotate(-5deg) scale(1.05);
      }
    }

    .icon-waste {
      position: relative;
    }

    .waste-message {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%) scale(0);
      opacity: 0;
      font-size: 10px;
      font-weight: bold;
      color: white;
      background-color: #ef4444;

      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
      z-index: 5;

      transition: opacity 0.3s ease-out, transform 0.3s ease-out;
    }

    .stat-card:hover .waste-message {
      opacity: 1;
      animation: drag-message 1.5s infinite alternate;
    }

    /* Events (🗓️): Card Flip */
    .calendar-flip-card {
      transform-style: preserve-3d;
      transition: transform 0.8s;
      transform-origin: center bottom;
      position: relative;
      width: 100%;
      height: 100%;
    }

    .stat-card:hover .calendar-flip-card {
      transform: rotateX(180deg);
    }

    .calendar-front,
    .calendar-back {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .calendar-back {
      transform: rotateX(180deg);
    }

    @keyframes tree-grow {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.3) translateY(-5px);
        filter: brightness(1.2);
      }

      100% {
        transform: scale(1);
      }
    }

    .stat-card:hover .icon-tree {
      animation: tree-grow 1s ease-in-out;
    }

    .map-container {
      background-color: white;
      background-size: 20px 20px;
      position: relative;
      overflow: hidden;
    }

    .map-pin {
      position: absolute;
      cursor: pointer;
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 20;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.5));
      pointer-events: auto;

      transform: translate(-50%, -50%);

    }

    .map-pin:hover {
      transform: translate(-50%, -50%) scale(1.5) translateY(-5px);
      z-index: 30;
    }

    .map-tooltip {
      position: absolute;
      background: white;
      padding: 0.5rem;
      border-radius: 0.25rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      font-size: 0.75rem;
      pointer-events: none;
      z-index: 40;
      white-space: nowrap;
      display: none;
      border: 1px solid #e2e8f0;
      color: #1f2937;
    }


    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
    }

    .gallery-item {
      aspect-ratio: 1 / 1;
      overflow: hidden;
      position: relative;
      border-radius: 0.5rem;
      transition: box-shadow 0.3s ease-in-out, transform 0.3s;
      border: 1px solid #e2e8f0;
    }

    .gallery-item:hover {
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.2);
      transform: scale(1.02);
    }

    .gallery-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease-in-out, filter 0.3s ease-in-out;
      filter: brightness(0.9);
    }

    .gallery-item:hover .gallery-img {
      transform: scale(1.1);
      filter: brightness(0.4);
    }

    .gallery-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), rgba(0, 0, 0, 0.1));
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 1rem;
      opacity: 0;
      transition: opacity 0.3s ease-in-out;
      pointer-events: none;
    }

    .gallery-item:hover .gallery-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    .gallery-action {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 5px;
    }

    .gallery-action-icon {
      background-color: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      padding: 6px;
      transition: background-color 0.2s;
    }

    .gallery-item:hover .gallery-action-icon {
      background-color: rgba(255, 255, 255, 0.8);
    }


    .viz-bar {
      transition: width 1s ease-out;
    }


    .feature-card {
      transition: all 0.3s ease-in-out;
    }

    .feature-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 25px -5px rgba(52, 211, 153, 0.4), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }
  </style>
</head>

<body>
  <noscript>
    <div style="padding: 2rem; text-align: center; background-color: #fef2f2; color: #991b1b;">
      <h1 style="font-size: 1.5rem; font-weight: bold;">JavaScript is required to use this application.</h1>
      <p>Please enable JavaScript in your browser to access the Green Habit Ecosystem dashboard.</p>
      <p>This platform helps residents of Kanpur track green habits, join events, and build a sustainable
        community.</p>
    </div>
  </noscript>

  <canvas id="three-background"></canvas>

  <main id="app-root">
    <div id="welcome-wrapper" class="relative" style="height: 100%;">
      <div class="min-h-screen flex items-center justify-center text-xl text-green-600 bg-gray-50"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 9998;">
        <svg class="animate-spin h-8 w-8 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none"
          viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor"
            d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
          </path>
        </svg>
      </div>
    </div>
  </main>

  <div id="modal-container"></div>
  <div id="gallery-modal"
    class="fixed inset-0 z-[100] bg-black bg-opacity-90 flex justify-center items-center opacity-0 pointer-events-none transition-opacity duration-300">
    <div id="gallery-modal-content"
      class="relative max-w-4xl mx-4 my-8 p-4 bg-white rounded-lg shadow-2xl transition-transform duration-300 scale-95">
      <button id="modal-close"
        class="absolute top-2 right-2 text-white bg-gray-800 rounded-full p-2 hover:bg-gray-700 transition duration-200 z-50 focus-ring">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-200 pointer-events-none" fill="none"
          viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
      <img id="modal-image" class="max-h-[80vh] w-auto rounded-xl object-contain" src="" alt="Gallery Image"
        onerror="this.onerror=null;this.src='https://placehold.co/1200x1200/94A3B8/FFFFFF?text=Image+Load+Error'">
      <p id="modal-caption" class="text-center mt-3 text-gray-700 text-sm italic"></p>
    </div>
  </div>


  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import {
      getAuth,
      signInWithCustomToken,
      onAuthStateChanged,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      GoogleAuthProvider,
      signInWithPopup,
      sendPasswordResetEmail,
      signInAnonymously
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import {
      getFirestore,
      doc,
      getDoc,
      addDoc,
      setDoc,
      updateDoc,
      deleteDoc,
      onSnapshot,
      collection,
      //query,
      //where,
      writeBatch,
      arrayUnion,
      serverTimestamp,
      setLogLevel
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";


    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-green-habit-app';

    const INITIAL_AUTH_TOKEN = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    const apiKey = "";
    const LLM_MODEL_NAME = "gemini-2.5-flash-preview-09-2025";
    const LLM_API_URL = `https://generativelanguage.googleapis.com/v1beta/models/${LLM_MODEL_NAME}:generateContent?key=${apiKey}`;
    const SYSTEM_INSTRUCTION = "You are Dharti MITRA, an encouraging and knowledgeable AI guide in the Green Habit Ecosystem. Your purpose is to provide concise, factual, and actionable advice on sustainability, green habits, and environmental challenges. IMPORTANT: You MUST respond in the same language the user uses (e.g., respond in Hindi if the user asks in Hindi). Keep responses under 60 words.";

    let firebaseApp, auth, db;
    let FIREBASE_CONFIG = {};
    let unsubscribers = [];

    let signupRoleCache = null;
    let signupOrgDataCache = null;

    let chartInstance = null;
    let globalOpenGalleryModal;

    const state = {
      user: null,
      userId: null,
      userRole: null,
      isAuthReady: false,
      hasAuthenticatedThisSession: false,
      isLogin: true,
      isMenuOpen: false,
      route: 'homepage',
      points: 0,
      badges: [],
      habits: [],
      challenges: [],
      pointHistory: [],
      joinedEventIds: new Set(),
      libraryItems: [],
      events: [],
      wasteReports: [],
      librarySearchTerm: '',
      libraryCategoryFilter: 'all',
      isUpdating: false,

      loadingData: true,
      loadingHabits: true,
      loadingChallenges: true,
      loadingPointHistory: true,
      loadingLibrary: true,
      loadingEvents: true,
      loadingWasteReports: true,
      loadingLLM: false,
      isSubmitting: false,
      authError: '',
      modal: { isOpen: false },
      chatMessages: [{ id: 1, text: "Hello! I'm Dharti MITRA, your AI guide. Ask me anything about green habits or sustainability!", sender: "ai" }],
    };

    const updateState = (newState) => {

      if (newState.modal !== undefined) {
        renderModal(newState.modal);
      }
      Object.assign(state, newState);
    };

    const convertTimestamp = (timestamp) => {
      if (!timestamp) return new Date();
      if (timestamp.toDate) {
        return timestamp.toDate();
      }
      if (typeof timestamp.seconds === 'number' && typeof timestamp.nanoseconds === 'number') {
        return new Date(timestamp.seconds * 1000 + timestamp.nanoseconds / 1000000);
      }
      if (timestamp._seconds) {
        return new Date(timestamp._seconds * 1000 + (timestamp._nanoseconds || 0) / 1000000);
      }
      return new Date(timestamp);
    };

    const getDateString = (date) => new Date(date).toISOString().split('T')[0];
    const getTodayDateString = () => getDateString(new Date());
    const getYesterdayDateString = () => getDateString(new Date(Date.now() - 86400000));

    const sanitizeForAttr = (str) => {
      if (typeof str !== 'string') return '';
      return str.replace(/'/g, '&#39;').replace(/"/g, '&#34;').replace(/`/g, '&#96;');
    };

    const getEcoFact = () => {
      const facts = [
        { icon: "💡", fact: "A single reusable bag can save over 200 plastic bags a year from ending up in landfills or oceans." },
        { icon: "💧", fact: "Turning off the tap while brushing your teeth can save up to 8 gallons of water every day!" },
        { icon: "🌳", fact: "A mature tree can absorb up to 48 pounds of carbon dioxide per year, helping to clean the air." },
        { icon: "⚡", fact: "LED light bulbs use at least 75% less energy and last 25 times longer than incandescent bulbs." },
        { icon: "♻️", fact: "Recycling one aluminum can saves enough energy to run a TV for three hours." },
        { icon: "🚲", fact: "For short trips, walking or biking instead of driving is a great way to reduce your carbon footprint and improve your health." }
      ];
      const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / (1000 * 60 * 60 * 24));
      return facts[dayOfYear % facts.length];
    };


    const LoadingSpinner = (text = "Loading...") => `
      <div class="flex justify-center items-center py-8">
        <svg class="animate-spin h-6 w-6 text-green-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <span class="ml-3 text-lg text-gray-600">${text}</span>
      </div>
    `;

    const SkeletonListItem = () => `
        <div class="flex items-center justify-between p-4 border rounded-xl bg-gray-50 shadow-sm skeleton-pulse">

    const handleToggleHabit = async (habitId, currentStatusStr) => {
      const currentStatus = currentStatusStr === 'true';
      const habit = state.habits.find(h => h.id === habitId);
      if (!habit || !state.userId || state.isUpdating) return;

      updateState({ isUpdating: true });

      const isCompleting = !currentStatus;
      let newStreak = habit.streak;
      let newLastCompleted = habit.lastCompleted;
      let pointsChange = 0;
      let reason = "";

      const todayStr = getTodayDateString();
      const yesterdayStr = getYesterdayDateString();
      const lastCompletedStr = habit.lastCompleted ? getDateString(habit.lastCompleted) : null;

      if (isCompleting) {
        if (lastCompletedStr === todayStr) {
          updateState({ isUpdating: false });
          return;
        } else if (lastCompletedStr === yesterdayStr) {
          newStreak += 1;
        } else {
          newStreak = 1;
        }
        newLastCompleted = new Date();
        pointsChange = 10;
        reason = `Completed habit: ${habit.name}`;

      } else {
        if (lastCompletedStr === todayStr) {
          pointsChange = -10;
          reason = `Reverted habit: ${habit.name}`;


          const historicalLogs = state.pointHistory
            .filter(log => log.reason.startsWith(`Completed habit: ${habit.name}`) && getDateString(log.timestamp) !== todayStr)
            .sort((a, b) => b.timestamp - a.timestamp);

          if (historicalLogs.length > 0) {
            newLastCompleted = historicalLogs[0].timestamp;

            let count = 1;
            let currentDay = getDateString(new Date(historicalLogs[0].timestamp));
            for (let i = 1; i < historicalLogs.length; i++) {
              const prevDay = getDateString(new Date(historicalLogs[i].timestamp));
              if (getDateString(new Date(new Date(currentDay).getTime() - 86400000)) === prevDay) {
                count++;
                currentDay = prevDay;
              } else {
                break;
              }
            }
            newStreak = count;
          } else {
            newLastCompleted = null;
            newStreak = 0;
          }

        } else {
          updateState({ isUpdating: false });
          return;
        }
      }

      try {
        const batch = writeBatch(db);

        const habitRef = doc(db, 'artifacts', appId, 'users', state.userId, 'habits', habitId);
        batch.update(habitRef, {
          isCompletedToday: isCompleting,
          streak: newStreak,
          lastCompleted: newLastCompleted
        });

        const newPoints = (state.points || 0) + pointsChange;
        const profileRef = doc(db, 'artifacts', appId, 'users', state.userId);
        batch.update(profileRef, { points: newPoints });

        const historyRef = doc(collection(db, 'artifacts', appId, 'users', state.userId, 'pointHistory'));
        batch.set(historyRef, {
          amount: pointsChange,
          reason: reason,
          timestamp: serverTimestamp()
        });

        await batch.commit();

      } catch (error) {
        console.error("Error toggling habit:", error);
      } finally {
        updateState({ isUpdating: false });
      }
    };

    const sendToLLM = async (userPrompt) => {
      const payload = {
        contents: [{ parts: [{ text: userPrompt }] }],
        tools: [{ "google_search": {} }],
        systemInstruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
      };

      const maxRetries = 3;
      let delay = 1000;

      for (let i = 0; i < maxRetries; i++) {
        try {
          const response = await fetch(LLM_API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
          }

          const result = await response.json();
          const candidate = result.candidates?.[0];

          if (candidate && candidate.content?.parts?.[0]?.text) {
            return candidate.content.parts[0].text;
          }

          return "I'm having trouble thinking of a response right now. Please try rephrasing your question.";

        } catch (error) {
          if (i < maxRetries - 1) {
            await new Promise((resolve) => setTimeout(resolve, delay));
            delay *= 2;
          } else {
            console.error("LLM API failed after retries:", error);
            return "I'm having a little trouble connecting right now. Please try your question again in a moment.";
          }
        }
      }

      return "I'm having a little trouble connecting right now. Please try your question again in a moment.";
    };

      let scene, camera, renderer, objects = [];

      if (!container) return;

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;

      renderer = new THREE.WebGLRenderer({ canvas: container, antialias: true, alpha: true });

      renderer.setPixelRatio(window.devicePixelRatio);

      const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
      scene.add(ambientLight);

      const directionalLight = new THREE.DirectionalLight(0xffffff, 0.5);
      directionalLight.position.set(0, 5, 5);
      scene.add(directionalLight);

      const elementColors = [0x10b981, 0x3b82f6, 0x475569];
      const sphereRadii = [0.8, 0.6, 0.4];

      for (let i = 0; i < 3; i++) {
        const geometry = new THREE.IcosahedronGeometry(sphereRadii[i], 1);
        const material = new THREE.MeshPhongMaterial({
          color: elementColors[i],
          transparent: true,
          opacity: 0.4,
          shininess: 80,
          specular: 0xffffff,
          flatShading: true
        });
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(
          (Math.random() - 0.5) * 10,
          (Math.random() - 0.5) * 10,
          (Math.random() - 0.5) * 10
        );
        objects.push(mesh);
        scene.add(mesh);
      }

      const particleCount = 200;
      const particlesGeometry = new THREE.BufferGeometry();
      const positions = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount * 3; i += 3) {
        positions[i] = (Math.random() - 0.5) * 20;
        positions[i + 1] = (Math.random() - 0.5) * 20;
        positions[i + 2] = (Math.random() - 0.5) * 20;
      }
      particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const particleMaterial = new THREE.PointsMaterial({
        color: 0x90EE90,
        size: 0.05,
        transparent: true,
        opacity: 0.3
      });
      const particleMesh = new THREE.Points(particlesGeometry, particleMaterial);
      scene.add(particleMesh);
      objects.push(particleMesh);

      const animate = () => {
        requestAnimationFrame(animate);
        objects.forEach((obj, index) => {
          obj.rotation.x += 0.0005 * (index + 1);
          obj.rotation.y += 0.0008 * (index + 1);
          if (index < 3) {
            obj.position.x = Math.sin(Date.now() * 0.0001 * (index + 1)) * 4;
            obj.position.y = Math.cos(Date.now() * 0.00015 * (index + 1)) * 3;
          }
        });
        if (camera) {
          camera.position.x = Math.sin(Date.now() * 0.00005) * 1.5;
          camera.lookAt(scene.position);
        }
        if (renderer) {
          renderer.render(scene, camera);
        }
      };

      const onWindowResize = () => {
        if (camera && renderer) {
          camera.aspect = window.innerWidth / window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        }
      };

      window.addEventListener('resize', onWindowResize, false);
      animate();
    };

    const initSlider = () => {
      let currentSlide = 0;
      const sliderContainer = document.getElementById('slider-container');
      if (!sliderContainer) return;

      const slides = sliderContainer.querySelectorAll('.slide');
      const dots = sliderContainer.querySelectorAll('.slider-dot');
      const totalSlides = slides.length;

      if (totalSlides === 0) return;

      slides[0].classList.add('active-slide');

      const showSlide = (index, direction = 1) => {
        const nextIndex = (index + totalSlides) % totalSlides;
        const currentSlideElement = slides[currentSlide];
        const nextSlideElement = slides[nextIndex];

        if (currentSlideElement === nextSlideElement) return;

        nextSlideElement.style.transition = 'none';
        nextSlideElement.style.transform = `rotateY(${-direction * 90}deg)`;
        nextSlideElement.style.opacity = 0;
        nextSlideElement.classList.remove('active-slide');
        nextSlideElement.style.position = 'absolute';
        nextSlideElement.style.zIndex = 1;

        currentSlideElement.classList.add('transitioning-out');
        currentSlideElement.classList.remove('active-slide');
        currentSlideElement.style.transform = `rotateY(${direction * 90}deg)`;

        setTimeout(() => {
          nextSlideElement.style.transition = 'transform 0.8s ease-in-out, opacity 0.8s ease-in-out';
          nextSlideElement.style.transform = `rotateY(0deg)`;
          nextSlideElement.style.opacity = 1;
        }, 50);

        setTimeout(() => {
          currentSlideElement.classList.remove('transitioning-out');
          currentSlideElement.style.transform = `rotateY(0deg)`;
          currentSlideElement.style.opacity = 0;
          currentSlideElement.style.position = 'absolute';
          currentSlideElement.style.zIndex = 0;

          nextSlideElement.classList.add('active-slide');
          nextSlideElement.style.position = 'relative';

          currentSlide = nextIndex;

          dots.forEach(dot => dot.classList.remove('active'));
          const activeDot = document.querySelector(`#slider-container .slider-dot[data-slide="${currentSlide}"]`);
          if (activeDot) activeDot.classList.add('active');

        }, 800);
      };

      const prevButton = document.getElementById('slide-prev');
      const nextButton = document.getElementById('slide-next');

      if (prevButton) prevButton.addEventListener('click', () => {
        const prevIndex = (currentSlide - 1 + totalSlides) % totalSlides;
        showSlide(prevIndex, -1);
      });

      if (nextButton) nextButton.addEventListener('click', () => {
        const nextIndex = (currentSlide + 1) % totalSlides;
        showSlide(nextIndex, 1);
      });

      dots.forEach(dot => {
        dot.addEventListener('click', (e) => {
          if (e.target.dataset.slide) {
            const newIndex = parseInt(e.target.dataset.slide);
            if (newIndex !== currentSlide) {
              const direction = newIndex > currentSlide ? 1 : -1;
              showSlide(newIndex, direction);
            }
          }
        });
      });

      const autoPlayInterval = setInterval(() => {
        const wrapper = document.getElementById('slider-wrapper');

        if (wrapper) {
          const nextIndex = (currentSlide + 1) % totalSlides;
          showSlide(nextIndex, 1);
        } else {
          clearInterval(autoPlayInterval);
        }
      }, 5000);
    };

    const animateValue = (obj, start, end, duration) => {
      let startTimestamp = null;
      const step = (timestamp) => {
        if (!startTimestamp) startTimestamp = timestamp;
        const progress = Math.min((timestamp - startTimestamp) / duration, 1);
        let value = Math.floor(progress * (end - start) + start);

        if (obj.id === 'stat-citizens' || obj.id === 'stat-trees') {
          obj.innerHTML = value.toLocaleString();
        } else {
          obj.innerHTML = value;
        }

        if (progress < 1) {
          window.requestAnimationFrame(step);
        } else {
          // Animation complete
        }
      };
      window.requestAnimationFrame(step);
    };

    const initStatCounters = () => {
      const stats = document.querySelectorAll('.stat-number');
      const observer = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            const el = entry.target;
            const targetValue = parseInt(el.dataset.target.replace(/,/g, ''));
            if (typeof animateValue !== 'undefined') {
              animateValue(el, 0, targetValue, 1500);
            }
            observer.unobserve(el);
          }
        });
      }, { threshold: 0.5 });

      stats.forEach(stat => observer.observe(stat));
    };

    function detectCurrentLocation(btn) {
      const originalText = btn.innerHTML;
      const displayDiv = document.getElementById('detected-location-display');
      const locationSelect = document.getElementById('incident-location');

      btn.innerHTML = '⏳ Detecting...';
      btn.disabled = true;

      if (!navigator.geolocation) {
        updateState({ modal: { isOpen: true, title: "GPS Error", message: "Geolocation is not supported by your browser.", onConfirm: () => updateState({ modal: { isOpen: false } }) } });
        btn.innerHTML = originalText;
        btn.disabled = false;
        return;
      }

      const useMockLocation = () => {
        const mockLat = 26.4499;
        const mockLng = 80.3319;
        const mockAddress = `📍 Demo: ${mockLat}, ${mockLng} (Kanpur)`;

        detectedLocationData = { lat: mockLat, lng: mockLng };

        document.getElementById('detected-coords').textContent = mockAddress;
        displayDiv.classList.remove('hidden');
        locationSelect.disabled = true;

        btn.innerHTML = '✓ Demo Loc';
        btn.classList.remove('bg-gray-200', 'text-gray-700');
        btn.classList.add('bg-yellow-100', 'text-yellow-800', 'border-yellow-300');

        setTimeout(() => {
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, 3000);
      };

      if (!window.isSecureContext) {
        useMockLocation();
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          const { latitude, longitude } = position.coords;
          const mockAddress = `GPS: ${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;

          detectedLocationData = { lat: latitude, lng: longitude };

          document.getElementById('detected-coords').textContent = mockAddress;
          displayDiv.classList.remove('hidden');
          locationSelect.disabled = true;

          btn.innerHTML = '✓ Found';
          btn.classList.remove('bg-gray-200', 'text-gray-700');
          btn.classList.add('bg-green-100', 'text-green-800', 'border-green-300');

          setTimeout(() => {
            btn.innerHTML = originalText;
            btn.disabled = false;
          }, 2000);
        },
        (error) => {
          console.error("Error detecting location:", error);
          useMockLocation();
        },
        {
          enableHighAccuracy: true,
          timeout: 5000,
          maximumAge: 0
        }
      );
    }

    async function handleIncidentSubmit(e) {
      e.preventDefault();
      const form = e.target;
      const type = form.elements['incident-type'].value;
      let location = form.elements['incident-location'].value;
      const fileInput = form.elements['incident-photo'];
      const description = "Auto-Reported from Homepage Incident Form.";

      if (!fileInput.files[0]) {
        updateState({ modal: { isOpen: true, title: "Missing Photo", message: "Please select or take a photo first.", onConfirm: () => updateState({ modal: { isOpen: false } }) } });
        return;
      }

      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerText;
      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-75');

      const steps = ["Uploading Image...", "AI Scanning...", "Verifying...", "Submitting..."];
      for (const step of steps) {
        submitBtn.innerText = step;
        await new Promise(r => setTimeout(r, 600));
      }

      try {
        if (detectedLocationData) {
          location = `GPS: ${detectedLocationData.lat.toFixed(4)}, ${detectedLocationData.lng.toFixed(4)}`;
        }

        // This is where a real Firestore action would occur, but we'll manually fire a mock report for visual update.
        // NOTE: The previous handleReportWaste uses a modal with more fields. We keep this version simpler for the direct homepage flow.

        const reportData = {
          wasteType: type,
          location: location,
          description: description,
          reporterUid: state.userId || 'GUEST_USER',
          reporterName: state.user?.profile?.displayName || "Guest Reporter",
          status: "new",
          timestamp: serverTimestamp()
        };

        const reportsRef = collection(db, 'artifacts', appId, 'public/data', 'wasteReports');
        await addDoc(reportsRef, reportData); // Add to Firestore

        let x = 50 + (Math.random() * 10 - 5);
        let y = 50 + (Math.random() * 10 - 5);
        const newPin = {
          id: Date.now(),
          type: type === 'waste' ? 'waste' : (type === 'burn' ? 'burn' : 'tree'),
          x: x,
          y: y,
          location: location,
          desc: type === 'waste' ? 'Reported Garbage Dump' : (type === 'burn' ? 'Plastic Burning Alert' : 'New Tree Verification'),
          verified: true
        };
        mapData.push(newPin); // Update local map data
        renderPins(); // Re-render map pins live

        form.reset();
        document.getElementById('upload-preview').classList.add('hidden');
        document.getElementById('upload-placeholder').classList.remove('hidden');
        document.getElementById('file-name').textContent = '';
        document.getElementById('incident-location').disabled = false;
        document.getElementById('detected-location-display').classList.add('hidden');
        detectedLocationData = null;

        updateState({
          modal: {
            isOpen: true,
            title: 'Report Verified & Submitted',
            message: `AI Analysis Complete: Verified as ${type}. Your report for ${location} has been logged. The map has been updated live.`,
            confirmText: 'Done',
            onConfirm: () => updateState({ modal: { isOpen: false } })
          }
        });

      } catch (error) {
        updateState({
          modal: {
            isOpen: true,
            title: 'Submission Failed',
            message: `Could not submit report: ${error.message}. Please try again.`,
            confirmText: 'Close',
            onConfirm: () => updateState({ modal: { isOpen: false } })
          }
        });
      } finally {
        submitBtn.innerText = originalText;
        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-75');
      }
    }

            <form id="waste-report-form" class="space-y-4">
              <div>
                <label for="reportLocation" class="block text-sm font-medium text-gray-700">Exact Location / Address</label>
                <input type="text" name="reportLocation" id="reportLocation" placeholder="e.g., Near Kanpur Central Gate 5"
                  class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-lg shadow-inner focus:ring-red-500 focus:border-red-500"
                  required />
              </div>
              <div>
                <label for="wasteType" class="block text-sm font-medium text-gray-700">Type of Waste</label>
                <select name="wasteType" id="wasteType"
                  class="mt-1 block w-full px-3 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-red-500 focus:border-red-500 bg-white transition duration-150"
                  required>
                  <option value="">Select Type</option>
                  <option value="Construction Debris">Construction Debris</option>
                  <option value="Plastic/Non-Biodegradable">Plastic/Non-Biodegradable</option>
                  <option value="Industrial Waste">Industrial Waste</option>
                  <option value="Organic Dump">Organic Dump</option>
                  <option value="Other">Other</option>
                </select>
              </div>
              <div>
                <label for="reportDescription" class="block text-sm font-medium text-gray-700">Detailed Description
                  (Visibility to Authorities)</label>
                <textarea name="reportDescription" id="reportDescription" rows="3"
                  placeholder="Describe the severity and quantity of waste."
                  class="mt-1 w-full px-4 py-3 border border-gray-300 rounded-lg shadow-inner focus:ring-red-500 focus:border-red-500"
                  required></textarea>
              </div>
              <p class="text-xs text-red-600">Note: Uploading a picture (mock demo only) or providing a GPS coordinate will
                be available in the next update.</p>

              <div class="flex justify-end space-x-3 pt-4">
                <button type="button" data-action="modal-cancel-report"
                  class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-200 rounded-lg hover:bg-gray-300 transition duration-150 btn-transition focus-ring">Cancel</button>
                <button type="submit"
                  class="px-4 py-2 text-sm font-medium text-white bg-red-600 rounded-lg hover:bg-red-700 transition duration-150 btn-transition focus-ring">Submit
                  Report (50 Pts)</button>
              </div>
            </form>
          </div>
        </div>
        `;

      modalContainer.innerHTML = formHtml;

      document.getElementById('waste-report-form').addEventListener('submit', (e) => {
        e.preventDefault();
        handleReportWaste(e.target);
      });


      document.getElementById('waste-report-modal').addEventListener('click', (e) => {

        if (e.target.id === 'waste-report-modal') {
          e.preventDefault();
          document.getElementById('waste-report-modal').remove();
        }
      });
    };

    const masterAppClickHandler = (e) => {
      let target = e.target.closest('[data-action], [data-route]');
      if (!target) return;


      if (e.target.closest('[data-action="modal-content"]') || e.target.closest('[data-action="modal-content-stop"]')) {
        if (target.dataset.action !== 'modal-cancel' && target.dataset.action !== 'modal-confirm') {
          return;
        }
      }

      const action = target.dataset.action;
      const route = target.dataset.route;

      if (route) {
        e.preventDefault();
        const userRole = state.userRole || "individual";
        const allRoutes = getNavigableRoutes();
        const requestedRoute = allRoutes.find(r => r.id === route);

        if (requestedRoute && requestedRoute.requiredRoles.includes(userRole)) {
          updateState({ route: route, isMenuOpen: false });
          renderMainContent(route);
          updateHeader();
        } else {
          console.warn(`Role "${userRole}" cannot access route "${route}".`);
          updateState({ isMenuOpen: false });
          updateHeader();
        }
        return;
      }

      if (action) {
        e.preventDefault();

        switch (action) {
          case 'toggle-login':
            updateState({ isLogin: !state.isLogin, authError: '' });
            renderAuthScreen();
            break;
          case 'google-signin':
            handleGoogleSignIn();
            break;
          case 'guest-signin':
            handleGuestSignIn();
            break;
          case 'forgot-password':
            const emailEl = document.getElementById('email');
            handleForgotPassword(emailEl?.value);
            break;
          case 'sign-out':
            handleSignOut();
            break;

          case 'toggle-menu':
            updateState({ isMenuOpen: !state.isMenuOpen });
            updateHeader();
            break;
          case 'modal-cancel':
            state.modal.onCancel ? state.modal.onCancel() : updateState({ modal: { isOpen: false } });
            break;
          case 'modal-confirm':
            state.modal.onConfirm ? state.modal.onConfirm() : updateState({ modal: { isOpen: false } });
            break;
          case 'modal-cancel-report':
            document.getElementById('waste-report-modal')?.remove();
            break;

          case 'report-waste-form':
            renderWasteReportForm();
            break;

          case 'open-map':
          case 'mock-air-quality':
            updateState({ modal: { isOpen: true, title: "Feature Coming Soon", message: "This interactive feature is currently in development. Stay tuned!", onConfirm: () => updateState({ modal: { isOpen: false } }) } });
            break;

          case 'add-habit':
            const habitNameEl = document.getElementById('new-habit-name');
            const habitName = habitNameEl?.value.trim();
            if (habitName) {
              handleAddHabit(habitName);
              habitNameEl.value = '';
            }
            break;
          case 'toggle-habit':
            handleToggleHabit(target.dataset.habitId, target.dataset.currentStatus);
            break;
          case 'delete-habit':
            handleDeleteHabit(target.dataset.deleteId);
            break;
          case 'join-challenge':
            handleJoinChallenge(target.dataset.id, target.dataset.name);
            break;
          case 'join-event':
            handleJoinEvent(target.dataset.id, target.dataset.name);
            break;
          case 'update-report-status':
            handleUpdateReportStatus(target.dataset.id, target.dataset.status);
            break;

          case 'join-event-detail':
            const joinEventId = target.dataset.eventId;
            const joinEvent = state.events.find(e => e.id === joinEventId);
            if (!joinEvent) return;
            const joinEventDate = new Date(joinEvent.date);
            const joinDateString = joinEventDate.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });

            updateState({
              modal: {
                isOpen: true,
                title: `Event: ${joinEvent.title}`,
                message: `
                <p class="mb-2"><strong>Date:</strong> ${joinDateString}</p>
                <p class="mb-2"><strong>Location:</strong> ${joinEvent.location}</p>
                <p class="mb-4">${joinEvent.description}</p>
                `,
                onConfirm: () => handleJoinEvent(joinEvent.id, joinEvent.title),
                onCancel: () => updateState({ modal: { isOpen: false } }),
                confirmText: "Join (25 Pts)",
                cancelText: "Cancel"
              }
            });
            break;
          case 'view-event-detail':
            const viewEventId = target.dataset.eventId;
            const viewEvent = state.events.find(e => e.id === viewEventId);
            if (!viewEvent) return;
            const viewEventDate = new Date(viewEvent.date);
            const viewDateString = viewEventDate.toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });

            updateState({
              modal: {
                isOpen: true,
                title: `Event: ${viewEvent.title}`,
                message: `
                <p class="mb-2"><strong>Date:</strong> ${viewDateString}</p>
                <p class="mb-2"><strong>Location:</strong> ${viewEvent.location}</p>
                <p class="mb-4">${viewEvent.description}</p>
                <p class="font-bold text-blue-600">You have already joined this event.</p>
                `,
                onConfirm: () => updateState({ modal: { isOpen: false } }),
                confirmText: "Close"
              }
            });
            break;

          case 'watch-video':
            updateState({
              modal: {
                isOpen: true,
                title: target.dataset.title,
                message: `<div class="aspect-w-16 aspect-h-9"><iframe src="https://www.youtube.com/embed/${target.dataset.videoId}"
                frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen class="w-full h-full rounded-lg" style="height: 250px;"></iframe></div>`,
                onConfirm: () => updateState({ modal: { isOpen: false } }),
                confirmText: "Close"
              }
            });
            break;
          case 'view-image':
            updateState({
              modal: {
                isOpen: true,
                title: target.dataset.title,
                message: `<img src="${target.dataset.imageUrl}" alt="${sanitizeForAttr(target.dataset.title)}"
                class="w-full h-auto rounded-lg object-contain max-h-[60vh]">`,
                onConfirm: () => updateState({ modal: { isOpen: false } }),
                confirmText: "Close"
              }
            });
            break;

          case 'manage-event':
            updateState({
              modal: {
                isOpen: true,
                title: `Manage: ${target.dataset.eventName}`,
                message: "This is a demo. In a real app, you could view volunteers, send updates, or cancel the event here.",
                onConfirm: () => updateState({ modal: { isOpen: false } }),
                confirmText: "Got it"
              }
            });
            break;
          case 'approve-challenge':
            handleUpdateChallengeStatus(target.dataset.id, 'approved');
            break;
          case 'reject-challenge':
            handleUpdateChallengeStatus(target.dataset.id, 'rejected');
            break;
        }
      }
    };

    const masterAppSubmitHandler = (e) => {
      e.preventDefault();
      const form = e.target;

      switch (form.id) {
        case 'auth-form':
          handleAuthSubmit(form);
          break;
        case 'chat-form':
          handleChatSubmit(form);
          break;
        case 'create-challenge-form':
          handleCreateChallenge(form);
          break;
        case 'create-event-form':
          handleCreateEvent(form);
          break;
        case 'create-post-form':
          handleCreatePost(form);
          break;
      }
    };

    const masterAppChangeHandler = (e) => {
      const target = e.target;
      const action = e.target.dataset.action;

      if (action) {
        switch (action) {
          case 'role-change':
            const orgDetails = document.getElementById('org-details');
            if (target.value === 'individual') {
              orgDetails?.classList.add('hidden');
            } else {
              orgDetails?.classList.remove('hidden');
            }
            break;

          case 'post-type-change':
            const postType = target.value;
            const linkField = document.getElementById('post-link-field');
            const fileField = document.getElementById('post-file-field');
            const fileInput = document.getElementById('postFile');
            const linkLabel = document.querySelector('label[for="postLink"]');

            if (postType === 'image_file' || postType === 'video_file') {
              linkField?.classList.add('hidden');
              fileField?.classList.remove('hidden');
              if (fileInput) fileInput.setAttribute('accept', postType === 'image_file' ? 'image/*' : 'video/*');
            } else {
              linkField?.classList.remove('hidden');
              fileField?.classList.add('hidden');
              if (linkLabel) {
                linkLabel.textContent = (postType === 'video_yt') ? 'Video (YouTube ID)' : 'Link (URL)';
              }
            }
            break;

          case 'post-file-change':
            const fileDisplay = document.getElementById('file-upload-name');
            const fileText = document.getElementById('file-upload-text');
            if (target.files.length > 0) {
              if (fileDisplay) fileDisplay.textContent = target.files[0].name;
              if (fileText) fileText.textContent = "Change file...";
            } else {
              if (fileDisplay) fileDisplay.textContent = '';
              if (fileText) fileText.textContent = "Choose a file...";
            }
            break;
        }
      }

      switch (target.id) {
        case 'library-search':

          break;
        case 'library-category-select':
          updateState({ libraryCategoryFilter: target.value });
          renderMainContent('library');
          break;
      }
    };

    const startFirebase = () => {
      try {
        firebaseApp = initializeApp(FIREBASE_CONFIG);
        auth = getAuth(firebaseApp);
        db = getFirestore(firebaseApp);
        setLogLevel('Debug');

        onAuthStateChanged(auth, async (currentUser) => {
          if (currentUser) {
            await initializeUserSession(currentUser);
            renderGlobalDashboard();
            renderMainContent(state.route);
          } else {
            clearDataListeners();
            updateState({
              user: null,
              userId: null,
              userRole: null,
              isAuthReady: true,
              isLogin: true,
              route: 'login',
              points: 0,
              badges: [],
              habits: [],
              challenges: [],
              pointHistory: [],
              libraryItems: [],
              events: [],
              joinedEventIds: new Set(),
              wasteReports: [],
              chatMessages: [{ id: 1, text: "Hello! I'm Dharti MITRA, your AI guide. Ask me anything about green habits or sustainability!", sender: "ai" }],
              authError: '',
              isMenuOpen: false,
              hasAuthenticatedThisSession: false
            });
            renderAuthScreen();
          }
        });

        if (INITIAL_AUTH_TOKEN) {
          signInWithCustomToken(auth, INITIAL_AUTH_TOKEN)
            .then(() => updateState({ hasAuthenticatedThisSession: true }))
            .catch(e => {
              console.warn("Custom token sign-in failed. Falling back to anonymous sign-in.", e);
              signInAnonymously(auth);
            });
        } else {
          signInAnonymously(auth);
        }

      } catch (e) {
        console.error("Firebase initialization failed:", e);
        updateState({ isAuthReady: true, authError: "Firebase failed to load." });
        renderAuthScreen();
      }
    };

    const initApp = () => {
      document.body.addEventListener('click', masterAppClickHandler);
      document.body.addEventListener('submit', masterAppSubmitHandler);
      document.body.addEventListener('change', masterAppChangeHandler);

      document.body.addEventListener('input', (e) => {
        if (e.target.id === 'library-search') {
          if (window.searchTimeout) clearTimeout(window.searchTimeout);
          window.searchTimeout = setTimeout(() => {
            updateState({ librarySearchTerm: e.target.value });
            renderMainContent('library');
            document.getElementById('library-search')?.focus();
          }, 300);
        }
      });

      let configLoaded = false;
      const root = document.getElementById('app-root');

      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        try {
          FIREBASE_CONFIG = JSON.parse(__firebase_config);
          configLoaded = true;
        } catch (e) {
          console.error("Failed to parse environment Firebase config:", e);
          if (root) root.innerHTML = `
            <div class="min-h-screen flex items-center justify-center text-xl text-red-600 bg-gray-100 p-4 text-center">
              <p>⚠️ FATAL ERROR: Failed to parse provided Firebase config. Check console.</p>
            </div>`;
          return;
        }
      }
      else {

        FIREBASE_CONFIG = {
          apiKey: "AIzaSyDo52TysuQKLtmb0ByMeCOJ3dPJezUbm2A",
          authDomain: "green-habbit-2d512.firebaseapp.com",
          projectId: "green-habbit-2d512",
          storageBucket: "green-habbit-2d512.firebasestorage.app",
          messagingSenderId: "822493347593",
          appId: "1:822493347593:web:8b76cbc52c433a042f9dd8",
          measurementId: "G-WBE4ZJ37DD"
        };
        configLoaded = true;
      }

      if (configLoaded) {
        startFirebase();
      }
    };

    initApp();
  </script>
</body>

</html>
